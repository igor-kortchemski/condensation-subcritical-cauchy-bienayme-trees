name = "subcritical_cauchy"
version = "0.1.0"
defaultTargets = ["SubcriticalCauchy", "BGW", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "SubcriticalCauchy"

[[lean_lib]]
name = "BGW"
srcDir = "Vendor/BGW"

[[lean_lib]]
name = "Challenge"
globs = ["Challenge"]

[[lean_lib]]
name = "Solution"
globs = ["Solution"]
