# Metadata of the formalization, schema v0.4 (baseline recorded in docs/PUBLICATION.md).
version: v0.4
project:
  name: Condensation in subcritical Cauchy Bienaymé trees
  description: >-
    Lean 4 and Mathlib formalization of every result of the paper, four of them
    in corrected form: condensation of the maximal degree, the geometric height
    of the condensation vertex and the logarithmic height of size-conditioned
    subcritical Bienaymé trees whose offspring law is in the Cauchy domain of
    attraction, the one-big-jump principle behind them (by two proofs, one
    following the paper through the Armendáriz–Loulakis criterion and Berger's
    local limit theorem), the stable limit, the fluctuations of the maximal
    degree and the second-order height asymptotics.
  authors:
    - Igor Kortchemski
  license: Apache-2.0
  responsible_maintainers:
    - Igor Kortchemski
classification:
  arxiv: [math.PR]
  msc2020: [60J80, 60F05, 60G50, 05C80]
sources:
  - title: Condensation in subcritical Cauchy Bienaymé trees
    authors: [Igor Kortchemski, Leonard Vetter]
    id: arXiv:2503.07530v2
    type: paper
    location: https://arxiv.org/abs/2503.07530v2
    relationship: formalizes
    note: >-
      Published as Electron. Commun. Probab. 30 (2025), paper no. 79,
      doi:10.1214/25-ECP726, with the same text; display (2.4) of arXiv v2 is
      (2.2) there. The paper is not covered by the code license.
    license: unknown
    author_endorsement: participated
related_formalizations:
  - id: https://github.com/igor-kortchemski/Bienayme-Galton-Watson-Trees
    relationship: adapts
    note: >-
      Bienaymé–Galton–Watson trees. A snapshot of its plane-tree and
      Bienaymé-law modules is vendored in Vendor/BGW (Apache-2.0).
status:
  scope: >-
    Every numbered result and substantive unnumbered claim of the paper is
    proved, proved in a corrected form, or refuted as stated by a Lean
    counterexample; historical and background citations of Section 1 are not
    formalized. The corrected statements are (2.4) (centring constant
    1 - γ_E), Corollary 4.1 (same constant), Proposition 4.5(ii) (power of
    log(1/m)) and the five-case classification of Section 2.2 (hypothesis
    ν_0 > 0). Slow variation is taken with L Lebesgue measurable. Challenge.lean
    states the 20 compared results with sorry, as the comparison interface;
    no other file contains sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models: [claude-opus-5-5, claude-sonnet-5-5, moonshotai/kimi-k3.1-pro, gpt-6.1-sol, gpt-6-astra]
      framework: Codex, then Claude Code
      tool_setup: >-
        Lean 4.35.0 and Mathlib v4.35.0, the lean-autoformalization skills, a
        Claude Code coordinator with background Codex workers writing the Lean,
        independent agent audits of statements and coverage, and the author's
        approval of the main statements before their proofs.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
        hardware: not tracked
      prompting_notes: >-
        Formalize every claim of the paper, the main results first, preserving
        hypotheses, quantifiers and boundary cases; record corrections instead
        of silently repairing statements.
  spend_usd: not tracked
  notes: >-
    The code and documentation were generated by AI agents. Agent audits are
    not human peer review, and no human has reviewed the proofs line by line.
fidelity:
  divergences: >-
    Four statements are formalized in corrected form (see status.scope). Some
    proofs take different routes from the paper, recorded in
    FORMALIZATION_REPORT.md (D1–D18): Theorem 3.1 is proved both by a direct
    endpoint route and by the paper's route; Theorem 1.1(ii), Proposition 4.2
    and Proposition 4.3(ii) use the cyclic residual of the Łukasiewicz path;
    the stable limit uses Laplace transforms; the Heathcote–Seneta–Vere-Jones
    criterion and Lemma 4.4(i) have self-contained proofs. Claims refuted as
    stated are recorded with their counterexamples in
    MANUSCRIPT_RECOMMENDATIONS.md. The erratum erratum-ECP2025.pdf gives every
    correction with its location in the journal version.
review:
  status: statements approved by an author of the paper; agent-audited; proofs kernel-checked, not human-reviewed
  reviewers: [Igor Kortchemski (statements), Claude Sonnet 5.5 and GPT-6.1 Sol audit agents]
  notes: >-
    The official lake comparator with NanoDa and the Lean kernel passed on
    Linux on 11 November 2026; see verification/README.md.
alignment:
  namespace: SubcriticalCauchy
  statements:
    - source: Theorem 1.1 (i)
      lean: SubcriticalCauchy.Bienayme.main_maxDegree_condensation, SubcriticalCauchy.Bienayme.main_secondMaxDegree_negligible
      module: SubcriticalCauchy.MainTheorems
      status: proved
    - source: Theorem 1.1 (ii)
      lean: SubcriticalCauchy.Bienayme.main_maxDegreeDepth_geometric
      module: SubcriticalCauchy.MainTheorems
      status: proved
    - source: Theorem 1.1 (iii)
      lean: SubcriticalCauchy.Bienayme.main_height_log, SubcriticalCauchy.Bienayme.main_height_tight_iff
      module: SubcriticalCauchy.MainTheorems
      status: proved
    - source: Theorem 3.1
      lean: SubcriticalCauchy.Bienayme.paper_deleted_maximum_tvDist, SubcriticalCauchy.Bienayme.paper_route_deleted_maximum_tvDist
      module: SubcriticalCauchy.Theorem31, SubcriticalCauchy.PaperRoute.Statements
      status: proved
    - source: Theorem 3.1 proof, Armendáriz–Loulakis criterion, Berger's local limit, conditions (2.6) and (3.3)
      lean: SubcriticalCauchy.ArmendarizLoulakis.al_criterion, SubcriticalCauchy.Bienayme.berger_local_limit, SubcriticalCauchy.Bienayme.paper_eq26, SubcriticalCauchy.Bienayme.paper_eq33
      module: SubcriticalCauchy.PaperRoute.Statements
      status: proved
    - source: Display (2.4) and the law of C_1
      lean: SubcriticalCauchy.Bienayme.paper_stable_limit, SubcriticalCauchy.Bienayme.exists_cauchyOneLaw
      module: SubcriticalCauchy.Corollary41
      status: proved in corrected form
      note: The limit is C_1 + 1 - γ_E.
    - source: Corollary 4.1
      lean: SubcriticalCauchy.Bienayme.paper_maxDegree_fluctuations
      module: SubcriticalCauchy.Corollary41
      status: proved in corrected form
      note: The limit is -C_1 - (1 - γ_E).
    - source: Propositions 4.2 and 4.3
      lean: SubcriticalCauchy.Bienayme.paper_attached_forest_tvDist, SubcriticalCauchy.Bienayme.paper_height_lower, SubcriticalCauchy.Bienayme.paper_height_upper
      module: SubcriticalCauchy.Propositions42_43
      status: proved
    - source: Proposition 4.5
      lean: SubcriticalCauchy.Bienayme.paper_height_second_order_log, SubcriticalCauchy.Bienayme.paper_height_second_order_pow
      module: SubcriticalCauchy.Proposition45
      status: (i) proved; (ii) proved in corrected form
      note: In (ii) the coefficient has log(1/m)^2 instead of log(1/m)^(1+β).
    - source: Section 2.2, five-case classification
      lean: SubcriticalCauchy.Bienayme.paper_heavyTail_classification
      module: SubcriticalCauchy.Classification
      status: proved in corrected form
      note: The hypothesis ν_0 > 0 is added.
    - source: Section 2.2, criterion for equivalence to a critical law
      lean: SubcriticalCauchy.TiltingCounterexample.critical_equivalence_boundary_counterexample
      module: SubcriticalCauchy.TiltingCounterexample
      status: contradicted as stated
